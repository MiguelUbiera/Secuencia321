<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro para el efecto tridimensional sutil (2.5D) -->
    <filter id="subtle-3d" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Sombra proyectada suave hacia abajo y la derecha -->
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />

      <!-- Sombra interior/bisel sutil para dar volumen sin recargar -->
      <feComponentTransfer>
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Base circular en crema de marca (paletas.md) con borde terracota de marca -->
  <circle
    cx="256"
    cy="256"
    r="246"
    fill="#dccfc4"
    stroke="#b85c3a"
    stroke-width="18"
    filter="url(#subtle-3d)"
  />

  <!-- Texto central en terracota de marca, 20% mas grande respecto al circulo -->
  <text
    x="256"
    y="256"
    fill="#b85c3a"
    font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
    font-size="240"
    font-weight="700"
    letter-spacing="-15"
    text-anchor="middle"
    dominant-baseline="central"
  >321</text>
</svg>
